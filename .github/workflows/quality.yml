name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run project tests
        run: python3 tests/test_project.py
      - name: Run publication guard
        run: python3 scripts/validate-repository.py
      - name: Run shellcheck
        run: |
          find scripts payload -type f -print0 \
            | xargs -0 grep -l '^#!/bin/sh' \
            | xargs shellcheck

